# Render Free Blueprint — 방·계정은 메모리에만 있고 수면·재시작·재배포 때 사라진다.
services:
  - type: web
    name: ai-chatroom
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: COOKIE_SECURE, value: "1" }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: PUBLIC_URL, sync: false }
      - { key: OPERATOR_NAME, sync: false }
      - { key: CONTACT_EMAIL, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GITHUB_CLIENT_ID, sync: false }
      - { key: GITHUB_CLIENT_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
