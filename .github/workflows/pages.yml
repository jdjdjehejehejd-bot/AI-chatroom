# main에 푸시할 때마다 데모 사이트를 다시 빌드해 GitHub Pages에 배포한다.
# 사용 전 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions"로 설정.
name: Deploy demo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build demo (server.js runs inside the page, demo AI replies only)
        run: |
          mkdir -p _site
          node preview/build.js _site/index.html
          touch _site/.nojekyll
      # Pages가 아직 켜져 있지 않으면 이 단계가 "Not Found"로 실패한다. 매 push마다 빨간 실패를 남기지 않도록 경고로 바꾸고,
      # Settings → Pages → Source를 "GitHub Actions"로 켜면 다음 push부터 자동으로 배포된다.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages 비활성 안내
        if: steps.pages.outcome != 'success'
        run: echo "::warning title=GitHub Pages가 켜져 있지 않아 데모 배포를 건너뜁니다::저장소 Settings → Pages → Build and deployment → Source를 'GitHub Actions'로 설정하세요."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
