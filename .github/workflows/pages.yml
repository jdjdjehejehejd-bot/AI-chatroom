# main에 푸시할 때마다 데모 사이트를 다시 빌드하고 GitHub Pages에 배포한다.
# 사용 전 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions"로 설정.
# 두 작업을 분리해 "빌드 성공"과 "실제 배포 성공"이 서로 다른 상태로 보이게 한다.
# 실제 서비스는 Render 서버이고 이 데모는 보조다. Pages가 꺼져 있으면 실패(빨강) 대신 경고를 남기고 배포 단계만 건너뛴다
# (매 푸시마다 빨간 실패가 쌓여 진짜 실패를 가리던 문제). 경고 문구로 '공개되지 않았음'을 분명히 남긴다.
name: Deploy demo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-demo:
    name: Build demo (build only, not a deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build demo (server.js runs inside the page, demo AI replies only)
        run: |
          mkdir -p _site
          node preview/build.js _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: _site
          include-hidden-files: true
  deploy-pages:
    name: Deploy to GitHub Pages (skipped with a warning if Pages is not enabled)
    needs: build-demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: _site
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages is not enabled (demo NOT published)
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages가 꺼져 있어 데모를 공개하지 않았습니다::실제 서비스(Render)와는 무관합니다. 데모를 다시 공개하려면 저장소 Settings → Pages → Source를 'GitHub Actions'로 설정하세요."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
