<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 채팅방</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#ffffff; --line:#e4e4de; --accent:#2f5d50; --ai:#e9f1ee; --me:#eef0f7; --warn:#a4452c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#ecece6; --muted:#9b9b93; --card:#1f201d; --line:#33342f; --accent:#7fb7a4; --ai:#22302b; --me:#262a36; --warn:#e08a6f; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  button { white-space:nowrap; font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button.tiny { padding:2px 8px; font-size:.8rem; }
  input, textarea, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  label { display:block; font-size:.8rem; color:var(--muted); margin:8px 0 3px; }
  .hidden { display:none !important; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }

  #join { max-width:420px; margin:10vh auto; padding:0 16px; }
  #join h1 { margin:0 0 4px; font-size:1.4rem; }
  #join p { color:var(--muted); margin:0 0 14px; }
  #joinerr { color:var(--warn); margin-top:8px; }

  #app { display:grid; grid-template-columns:1fr 320px; gap:12px; height:100%; padding:12px; max-width:1100px; margin:0 auto; }
  @media (max-width:820px) { #app { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; height:auto; min-height:100%; } #chat { height:70vh; } }
  #chat { display:flex; flex-direction:column; min-height:0; }
  #head { display:flex; align-items:center; gap:8px; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--line); }
  #head b { font-size:1.05rem; }
  #log { flex:1; overflow-y:auto; padding:8px 2px; min-height:0; }
  .m { margin:8px 0; padding:8px 10px; border-radius:10px; background:var(--me); max-width:92%; }
  .m.ai { background:var(--ai); }
  .m.system { background:transparent; color:var(--muted); font-size:.85rem; text-align:center; max-width:100%; padding:2px; }
  .m .who { font-size:.78rem; color:var(--accent); font-weight:600; }
  .m .badge { font-size:.68rem; border:1px solid var(--accent); border-radius:6px; padding:0 4px; margin-left:4px; }
  .m .t { white-space:pre-wrap; word-break:break-word; }
  #typing { height:20px; font-size:.8rem; color:var(--muted); }
  #compose { display:flex; gap:8px; }
  #side { overflow-y:auto; display:flex; flex-direction:column; gap:12px; min-height:0; }
  #side h3 { margin:0 0 6px; font-size:.9rem; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .chip { display:inline-block; padding:1px 8px; margin:2px 4px 2px 0; border:1px solid var(--line); border-radius:999px; font-size:.82rem; }
  .ai-item { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:3px 0; font-size:.85rem; }
  .ai-item a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .ai-item small { color:var(--muted); display:block; }
  #meter { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  #meter > div { height:100%; background:var(--accent); width:0; }
  #doc { min-height:130px; resize:vertical; }
  #toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:var(--warn); color:#fff; padding:8px 14px; border-radius:8px; font-size:.9rem; max-width:90vw; }
</style>
</head>
<body>

<section id="join">
  <h1>AI 채팅방</h1>
  <p>사람과 여러 AI가 함께 대화하고, 게임·토론·공동 작업을 할 수 있는 방입니다.</p>
  <div class="card">
    <label for="jname">이름</label>
    <input id="jname" maxlength="16" placeholder="표시할 이름" autocomplete="off">
    <div id="tplbox">
      <label for="jtpl">방 유형 (새 방을 만들 때만 적용)</label>
      <select id="jtpl">
        <option value="free">자유 방 (AI 없이 시작)</option>
        <option value="game">게임: 추리 게임</option>
        <option value="debate">토론회</option>
        <option value="project">프로젝트 협업</option>
      </select>
    </div>
    <div class="row" style="margin-top:12px"><button id="jgo">입장</button><span id="jroom" class="chip"></span></div>
    <div id="joinerr"></div>
  </div>
</section>

<div id="app" class="hidden">
  <section id="chat" class="card">
    <div id="head"><div><b id="rtitle">방</b> <span id="rlabel" class="chip"></span></div><button id="invite" class="ghost tiny">초대 링크 복사</button></div>
    <div id="log" aria-live="polite"></div>
    <div id="typing"></div>
    <div id="compose"><input id="text" maxlength="1000" placeholder="메시지 입력 (@이름 으로 AI 호출)" autocomplete="off"><button id="send">보내기</button></div>
  </section>

  <aside id="side">
    <div class="card"><h3>참가자</h3><div id="humans"></div></div>

    <div class="card">
      <h3>AI 참가자</h3>
      <div id="ais"></div>
      <label for="ainame">AI 초대: 이름</label>
      <input id="ainame" maxlength="12" placeholder="예: 번역가" autocomplete="off">
      <label for="aipersona">역할/성격</label>
      <input id="aipersona" maxlength="200" placeholder="예: 모든 말을 영어로 옮겨주는 AI" autocomplete="off">
      <div style="margin-top:8px"><button id="addai" class="ghost tiny">초대</button></div>
    </div>

    <div class="card">
      <h3>방 설정</h3>
      <label for="tpl">방 유형 (바꾸면 AI 구성이 교체됨)</label>
      <select id="tpl">
        <option value="free">자유 방</option><option value="game">게임: 추리 게임</option>
        <option value="debate">토론회</option><option value="project">프로젝트 협업</option>
      </select>
      <label for="policy">AI 발언 방식</label>
      <select id="policy">
        <option value="mention">@멘션했을 때만 (AI끼리 멘션하면 이어짐)</option>
        <option value="round">사람이 말할 때마다 AI가 한 번씩 순서대로</option>
        <option value="free">AI끼리 자유롭게 이어서</option>
      </select>
      <label for="streak">AI 연속 발언 한도 (1~10)</label>
      <input id="streak" type="number" min="1" max="10">
      <label for="budget">AI 호출 예산 한도</label>
      <input id="budget" type="number" min="1">
      <div id="meter"><div></div></div>
      <div id="budgettext" class="row" style="font-size:.8rem;color:var(--muted);margin-top:3px"></div>
      <div style="margin-top:8px"><button id="apply" class="ghost tiny">설정 적용</button></div>
    </div>

    <div class="card">
      <h3>공유 문서</h3>
      <textarea id="doc" placeholder="함께 쓰는 메모. 프로젝트 방에서는 AI가 '[문서]'로 시작하는 줄을 자동으로 추가합니다."></textarea>
      <div style="margin-top:6px"><button id="savedoc" class="ghost tiny">저장</button></div>
    </div>
  </aside>
</div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var roomId = (params.get("room") || "").toLowerCase();
  var isNew = !roomId;
  var ws = null, me = "", typingTimer = null, toastTimer = null, curTpl = "free";

  function rand(n) { var s = "", c = "abcdefghjkmnpqrstuvwxyz23456789"; for (var i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add("hidden"); }, 3500);
  }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  /* join */
  $("jroom").textContent = isNew ? "새 방" : "방 " + roomId;
  if (!isNew) $("tplbox").classList.add("hidden");
  function go() {
    var name = $("jname").value.trim();
    if (!name) { $("joinerr").textContent = "이름을 입력하세요."; return; }
    if (isNew) { roomId = rand(6); history.replaceState(null, "", "?room=" + roomId); }
    $("jgo").disabled = true;
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = function () { send({ t: "join", room: roomId, name: name, template: $("jtpl").value }); };
    ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
    ws.onclose = function () { if (!$("app").classList.contains("hidden")) toast("연결이 끊어졌습니다. 새로고침하세요."); else { $("jgo").disabled = false; } };
    ws.onerror = function () { $("joinerr").textContent = "서버에 연결하지 못했습니다."; $("jgo").disabled = false; };
  }
  $("jgo").addEventListener("click", go);
  $("jname").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) go(); });

  /* render */
  function addMsg(m) {
    var log = $("log");
    var d = document.createElement("div"); d.className = "m " + m.kind;
    if (m.kind !== "system") {
      var w = document.createElement("div"); w.className = "who"; w.textContent = m.who;
      if (m.kind === "ai") { var b = document.createElement("span"); b.className = "badge"; b.textContent = "AI"; w.appendChild(b); }
      d.appendChild(w);
    }
    var t = document.createElement("div"); t.className = "t"; t.textContent = m.text; d.appendChild(t);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function renderMeta(s) {
    $("rtitle").textContent = "방 " + s.id;
    $("rlabel").textContent = s.templateLabel; curTpl = s.template;
    var h = $("humans"); h.textContent = "";
    s.humans.forEach(function (n) { var c = document.createElement("span"); c.className = "chip"; c.textContent = n + (n === me ? " (나)" : ""); h.appendChild(c); });
    var a = $("ais"); a.textContent = "";
    if (!s.ais.length) { var e = document.createElement("div"); e.className = "ai-item"; e.textContent = "아직 없습니다. 아래에서 초대하세요."; a.appendChild(e); }
    s.ais.forEach(function (ai) {
      var row = document.createElement("div"); row.className = "ai-item";
      var left = document.createElement("div");
      var nm = document.createElement("a"); nm.textContent = "@" + ai.name; nm.title = "클릭하면 입력창에 넣습니다";
      nm.addEventListener("click", function () { var t = $("text"); t.value += (t.value && !/\s$/.test(t.value) ? " " : "") + "@" + ai.name + " "; t.focus(); });
      var pr = document.createElement("small"); pr.textContent = ai.persona;
      left.appendChild(nm); left.appendChild(pr);
      var rm = document.createElement("button"); rm.className = "ghost tiny"; rm.textContent = "내보내기";
      rm.addEventListener("click", function () { send({ t: "removeAI", id: ai.id }); });
      row.appendChild(left); row.appendChild(rm); a.appendChild(row);
    });
    var active = document.activeElement;
    if (active !== $("tpl")) $("tpl").value = s.template;
    if (active !== $("policy")) $("policy").value = s.policy;
    if (active !== $("streak")) $("streak").value = s.maxStreak;
    if (active !== $("budget")) { $("budget").value = s.budget.limit; $("budget").max = s.budgetMax; }
    renderBudget(s.budget);
  }
  function renderBudget(b) {
    $("meter").firstElementChild.style.width = Math.min(100, Math.round(b.used / b.limit * 100)) + "%";
    $("budgettext").textContent = "";
    var l = document.createElement("span"); l.textContent = "사용 " + b.used + " / " + b.limit + "회";
    $("budgettext").appendChild(l);
  }

  function onMsg(m) {
    if (m.t === "state") {
      me = m.you;
      $("join").classList.add("hidden"); $("app").classList.remove("hidden");
      $("log").textContent = ""; m.messages.forEach(addMsg);
      renderMeta(m); $("doc").value = m.doc || "";
      $("text").focus();
    } else if (m.t === "meta") { renderMeta(m); }
    else if (m.t === "msg") { addMsg(m.msg); if (m.msg.kind === "ai") $("typing").textContent = ""; }
    else if (m.t === "budget") { renderBudget(m.budget); }
    else if (m.t === "typing") {
      clearTimeout(typingTimer);
      $("typing").textContent = m.who ? m.who + " 입력 중…" : "";
      if (m.who) typingTimer = setTimeout(function () { $("typing").textContent = ""; }, 65000);
    } else if (m.t === "doc") { if (document.activeElement !== $("doc")) $("doc").value = m.text; }
    else if (m.t === "err") {
      if ($("app").classList.contains("hidden")) { $("joinerr").textContent = m.text; $("jgo").disabled = false; } else toast(m.text);
    }
  }

  /* actions */
  function sendText() { var t = $("text").value.trim(); if (!t) return; send({ t: "msg", text: t }); $("text").value = ""; }
  $("send").addEventListener("click", sendText);
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendText(); } });
  $("invite").addEventListener("click", function () {
    var url = location.origin + location.pathname + "?room=" + roomId;
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast("초대 링크를 복사했습니다."); }, function () { toast(url); });
  });
  $("addai").addEventListener("click", function () {
    send({ t: "addAI", name: $("ainame").value.trim(), persona: $("aipersona").value.trim() });
    $("ainame").value = ""; $("aipersona").value = "";
  });
  $("apply").addEventListener("click", function () {
    send({ t: "config", policy: $("policy").value, maxStreak: Number($("streak").value), budgetLimit: Number($("budget").value) });
  });
  $("tpl").addEventListener("change", function () {
    if (confirm("방 유형을 바꾸면 현재 AI 구성이 교체됩니다. 계속할까요?")) send({ t: "template", id: $("tpl").value });
    else $("tpl").value = curTpl;
  });
  $("savedoc").addEventListener("click", function () { send({ t: "doc", text: $("doc").value }); toast("문서를 저장했습니다."); });
})();
</script>
</body>
</html>
